      noscript{position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:32px;background:#000;color:rgba(255,255,255,.78);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}

          }
        ]
      }
    </script>

  <body>
    <div id="root"></div>
    <div id="tqw-boot-fallback" role="status" aria-live="polite">
      <div>
        <strong>this quiet world couldn't start in this browser.</strong>
        <span>Try updating the browser, or open thisquiet.world in Chrome, Edge, Firefox or Safari and mirror/cast the screen.</span>
      </div>
    </div>
    <noscript>This Quiet World is an ad-free black screen and ambient sleep website with rain, snow, embers, storms, fireflies and a dim bedside clock. JavaScript is required to enter the world.</noscript>
    <script>
      (function () {
        if (/(?:^|[?&])test=/.test(window.location.search)) {
          var robots = document.querySelector('meta[name="robots"]')
          if (robots) robots.setAttribute('content', 'noindex, nofollow')
        }
      }())
    </script>
    <script>
      (function () {
        var html = document.documentElement
        var supportsModules = 'noModule' in document.createElement('script')
        var delay = supportsModules ? 5000 : 400
        window.setTimeout(function () {
          if (html.getAttribute('data-tqw-booted') === '1') return
          var fallback = document.getElementById('tqw-boot-fallback')
          if (fallback) fallback.style.display = 'flex'
        }, delay)
      }())
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
