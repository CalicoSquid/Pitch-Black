[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.16.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/about/index.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/rain-sounds"
  to = "/rain-sounds/"
  status = 301

[[redirects]]
  from = "/rain-sounds/index.html"
  to = "/rain-sounds/"
  status = 301

[[redirects]]
  from = "/bedside-clock"
  to = "/bedside-clock/"
  status = 301

[[redirects]]
  from = "/bedside-clock/index.html"
  to = "/bedside-clock/"
  status = 301
