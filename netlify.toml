[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.16.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/about/index.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/rain-sounds"
  to = "/rain-sounds/"
  status = 301

[[redirects]]
  from = "/rain-sounds/index.html"
  to = "/rain-sounds/"
  status = 301

[[redirects]]
  from = "/bedside-clock"
  to = "/bedside-clock/"
  status = 301

[[redirects]]
  from = "/bedside-clock/index.html"
  to = "/bedside-clock/"
  status = 301

[[redirects]]
  from = "/black-screen"
  to = "/black-screen/"
  status = 301

[[redirects]]
  from = "/black-screen/index.html"
  to = "/black-screen/"
  status = 301

[[redirects]]
  from = "/black-screen-for-sleep"
  to = "/black-screen-for-sleep/"
  status = 301

[[redirects]]
  from = "/black-screen-for-sleep/index.html"
  to = "/black-screen-for-sleep/"
  status = 301

[[redirects]]
  from = "/sleep-tools"
  to = "/sleep-tools/"
  status = 301

[[redirects]]
  from = "/sleep-tools/index.html"
  to = "/sleep-tools/"
  status = 301

[[redirects]]
  from = "/black-screen-with-clock"
  to = "/bedside-clock/"
  status = 301

[[redirects]]
  from = "/black-screen-with-clock/"
  to = "/bedside-clock/"
  status = 301

[[redirects]]
  from = "/night-clock"
  to = "/bedside-clock/"
  status = 301

[[redirects]]
  from = "/night-clock/"
  to = "/bedside-clock/"
  status = 301
